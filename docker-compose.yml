# Local development infrastructure.
# `pnpm db:up` starts PostgreSQL 17 matching production's engine, no local install.
# Volume `pgdata` persists across restarts; healthcheck gates dependents.
# Port 5433 on the host avoids clashing with a locally installed Postgres.
services:
  postgres:
    image: postgres:17-alpine
    container_name: restaurant-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: restaurant_db
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d restaurant_db"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - restaurant-net

volumes:
  pgdata:

networks:
  restaurant-net:
    driver: bridge
